# 모델 비교 글 (data/model_compare, Info_v2 DEV 60문항, 단계마다 1.5B / 3B / 7B × L4 / T4 × fp16 / 4bit)
# - 실험 단계 버튼으로 고른 단계(method)의 결과 파일만 쓴다. 그 단계 파일이 없으면 "결과 파일이 아직 없어요"
# - GPU 메모리는 결과 JSON의 config.gpu_memory_gb, 정밀도는 config.load_4bit에서 읽는다
# - 글 속 숫자는 직접 쓴다. 재실험하면 summary.py model_compare 출력을 보고 문장·숫자를 고치고 based_on을 갱신 (README 3-3)
based_on:
  folder: model_compare
  created_at: "2026-11-19T10:34:34"

question: 모델 크기와 GPU·정밀도를 바꾸면 성능과 속도가 어떻게 달라지나?

# 그래프 순서: 크기→성능, 크기→속도, GPU·정밀도→성능, GPU·정밀도→속도, 1.5B 설명
chart_order: [c4a, c4c, c4d, c4e, c4b]

# 크기별 비교 그래프(c4a~c4c)와 숫자 카드의 기준 조합
baseline_setup: {gpu: L4, precision: fp16}

# 모델별 표시 색 (GPU·정밀도 그래프 c4d·c4e). 새 모델은 여기에 추가
models:
  1.5B: {color: "#1D9E75"}
  3B: {color: "#378ADD"}
  7B: {color: "#D85A30"}
highlight_model: 3B      # 결과 표에서 강조할 모델 (최종 선택)

# 그래프 제목 (단계마다 다르면 by_stage.<단계>.charts에서 덮어쓴다)
charts:
  c4a:
    title: 모델을 키우면 성능이 좋아지나
    subtitle: 모델 크기별 · 질문 유형별 Macro F1 (GPU L4 · 정밀도 fp16 기준)
    hint: 그래프에 마우스를 올리면 모델별 상세 내용 표시
  c4b:
    title: 1.5B는 왜 점수가 높게 나왔나
    subtitle: 조건 검색 16문항 · 모델별 정밀도와 재현율의 간격 · 조건 검색 Macro F1 (GPU L4 · 정밀도 fp16 기준)
    accent: true     # 예외를 설명하는 그래프라 배경색을 다르게
    tips:
      precision: 모델이 쓴 이름 중 정답 비율 (조건 검색 16문항)
      recall: 정답 이름 중 모델이 찾아낸 비율 (조건 검색 16문항)
      filter_f1: 조건 검색 16문항의 문항별 F1 평균
  c4c:
    title: 모델을 키우면 속도가 빨라지나
    subtitle: 모델 크기별 · 질문 유형별 평균 응답 시간 (GPU L4 · 정밀도 fp16 기준)
  c4d:
    title: GPU·정밀도는 성능에 얼마나 영향을 주나
    subtitle: 모델 · GPU · 정밀도별 Macro F1
  c4e:
    title: GPU·정밀도는 속도에 얼마나 영향을 주나
    subtitle: 모델 · GPU · 정밀도별 평균 응답 시간

by_stage:
  rag_v4:
    summary:
      - "모델이 크다고 반드시 성능이 좋아지는 것은 아님"
      - "가장 높은 Macro F1 & 가장 빠른 응답 속도는 1.5B이지만, 조건 검색 재현율은 3B가 더 높음"
      - "GPU를 바꿔도 성능은 같고 속도만 달라짐 (L4가 T4보다 약 1.2~1.4배 빠름)"
      - "조건 검색 성능은 모델과 관계없이 0.3~0.5 수준으로 낮음"
      - "최종 선택한 챗봇 LLM 모델: **Qwen2.5-3B**"
    charts:
      c4a:
        insights:
          - "**모델 크기를 키워도 성능이 좋아지지 않음**"
          - 1.5B가 Macro F1 0.860으로 1위
          - 7B(0.806)는 3B(0.796)와 비슷한 수준
          - 캐릭터 조회는 세 모델 모두 거의 만점이라, 점수 차이는 대부분 조건 검색에서 나옴
          - "7B에서 'Appears in the region of 나타'처럼 영어가 섞이는 답변이 발생해 캐릭터 조회 성능이 일부 하락함"
      c4b:
        insights:
          - "**조건 검색에서 이름을 적게 출력해(평균 3.6명) 정밀도가 높아진 영향**"
          - 조건 검색 정밀도는 1.5B 0.526, 3B 0.208, 7B 0.279로 1.5B가 가장 높음
          - 재현율은 오히려 3B가 더 높음 (1.5B 0.500 < 3B 0.750)
          - 즉, 1.5B는 답변을 보수적으로 출력하는 경향이 있음
          - 1.5B의 높은 점수가 조건 판단 능력이 더 좋다는 의미는 아님
      c4c:
        insights:
          - "**모델이 커질수록 느려짐**"
          - 평균 응답 시간이 1.5B 1.179초 → 3B 1.901초 → 7B 2.036초로 늘어남
          - 캐릭터 조회는 모델 크기와 관계없이 1.047~1.371초로 큰 차이가 없음
          - "차이는 조건 검색에서 큼: 1.5B는 1.568초, 3B·7B는 3.915~4.024초"
          - 1.5B가 빠른 이유는 모델이 작아서이기도 하지만, 조건 검색에서 이름을 적게 쓰기 때문이기도 함
      c4d:
        insights:
          - "**같은 모델 안에서는 GPU·정밀도를 바꿔도 점수가 거의 그대로**"
          - 7B는 4가지 조합 모두 0.806으로 같음
          - DEV 60문항 규모에서 0.01~0.02 차이는 의미 있는 차이로 보기 어려움
          - 7B는 4bit로 줄여도 점수가 같아, GPU 메모리를 14.19GB → 5.45GB로 줄일 수 있음
      c4e:
        insights:
          - "**GPU는 점수가 아니라 속도를 바꿈**"
          - 같은 모델·정밀도면 L4가 T4보다 약 1.2~1.4배 빠름 (1.5B·3B 기준)
          - T4에서 7B fp16은 평균 11.888초로 실사용이 어렵고, 7B를 쓴다면 4bit(3.405초)가 현실적
          - L4에서는 7B fp16(2.036초)과 4bit(1.917초)의 속도 차이가 크지 않음
    findings:
      - title: GPU를 바꿔도 정확도는 동일
        desc: 차이는 응답 속도뿐
        sub: L4가 T4보다 약 1.2~1.4배 빠름 (1.5B·3B 기준)
      - title: 모델 크기를 키워도 성능이 좋아지지 않음
        sub: 1.5B 0.860 1위 · 7B는 3B와 비슷 · 7B는 영어가 섞인 답으로 캐릭터 조회 일부 하락
      - title: 1.5B의 높은 점수는 조건 판단 능력 때문이 아님
        sub: 조건 검색 재현율 1.5B 0.500 < 3B 0.750 · 답을 보수적으로 짧게 출력
      - title: 7B는 4bit로 줄여도 점수가 같음
        sub: 7B 4가지 조합 모두 0.806 · GPU 메모리 14.19GB → 5.45GB
      - title: T4에서 7B fp16은 비효율적
        sub: 평균 11.888초 · 메모리 부족으로 일부가 CPU로 넘어갔을 가능성
    problems:
      - title: 조건 검색 성능이 전반적으로 낮음
        items:
          - 모델과 관계없이 0.3~0.5 수준
          - "\"나타 출신 4성\" 질문은 8개 실험 모두 오답"
          - 모델 크기 문제가 아니라 RAG 검색·조건 처리 문제일 가능성이 큼
          - → rag_v5에서 조건 검색 개선 후 재평가
      - title: 캐릭터 이름 출력 오류가 계속 발생
        items:
          - "예: 카미サト アヤカ, 노드克赖, JANSA"
          - → 모델 변경만으로 해결되지 않아 이름 정규화·후처리 유지
      - title: DEV 평가 문항 수가 적음
        items:
          - 전체 60문항, 조건 검색 16문항
          - 0.01~0.02 정도의 점수 차이는 큰 의미를 두기 어려움
          - → F1 비교 외에 문항별 오류 분석이 중요
    next: rag_v5(조건 검색 개선) 이후 같은 날·같은 GPU로 1.5B / 3B / 7B 다시 비교

  rag_v5:
    chart_order: [c4a, c4c, c4d, c4e]   # 1.5B 설명 그래프(c4b)는 rag_v4에서만
    summary:
      - "조건 검색 근거를 좁히자 세 모델 모두 Macro F1이 0.9 이상으로 올라감"
      - "가장 높은 Macro F1은 3B(0.956), 가장 빠른 응답 속도는 1.5B(1.101초)"
      - "GPU를 바꿔도 성능은 거의 같고 속도만 달라짐 (L4가 T4보다 약 1.2~1.4배 빠름)"
      - "1.5B는 조건 검색에서 이름을 빠뜨려 재현율이 낮음 (0.77)"
      - "최종 선택한 챗봇 LLM 모델: **Qwen2.5-3B**"
    charts:
      c4a:
        insights:
          - "**3B가 가장 높고, 7B는 3B와 비슷한 수준**"
          - 3B가 Macro F1 0.956으로 1위
          - 7B(0.947)는 3B와 비슷하고, 1.5B(0.908)가 가장 낮음
          - 캐릭터 조회는 세 모델 모두 거의 만점이라, 점수 차이는 대부분 조건 검색에서 나옴
          - 3B는 데이터 없음 1문항(미르하젤)에 5성으로 답해 데이터 없음 점수가 0.750
      c4c:
        insights:
          - "**모델이 커질수록 느려짐**"
          - 평균 응답 시간이 1.5B 1.101초 → 3B 1.268초 → 7B 1.561초로 늘어남
          - 캐릭터 조회는 모델 크기와 관계없이 1.027~1.385초로 큰 차이가 없음
          - "조건 검색도 1.326~2.094초로, rag_v4(1.568~4.024초)보다 모델 간 차이가 줄어듦"
          - 근거를 '조건을 모두 만족하는 캐릭터'로 좁혀 조건 검색 답 길이가 2.5~3.3명으로 짧아졌기 때문
      c4d:
        insights:
          - "**같은 모델 안에서는 GPU를 바꿔도 점수가 거의 그대로**"
          - 3B·7B는 L4와 T4의 점수가 같고, 1.5B만 0.908 / 0.904로 0.004 차이
          - 7B 4bit는 0.913으로 fp16(0.947)보다 0.034 낮음 (캐릭터 조회 0.950, 조건 검색 0.798)
          - DEV 60문항 규모라 0.03 정도의 차이는 문항별로 확인이 필요함
      c4e:
        insights:
          - "**GPU는 점수가 아니라 속도를 바꿈**"
          - 같은 모델·정밀도면 L4가 T4보다 약 1.2~1.4배 빠름 (1.5B·3B 기준)
          - T4에서 7B fp16은 평균 6.353초(최대 27.434초)로 실사용이 어렵고, 7B를 쓴다면 4bit(3.261초)가 현실적
          - T4 7B fp16은 메모리 한계로 일부가 CPU로 넘어갔을 가능성이 있음 (추정)
    findings:
      - title: 조건 검색 근거를 좁히자 세 모델 모두 점수가 올라감
        sub: rag_v4 → rag_v5 · 1.5B 0.860 → 0.908 · 3B 0.796 → 0.956 · 7B 0.806 → 0.947 (L4 · fp16)
      - title: 3B가 Macro F1 1위
        sub: 3B 0.956 · 7B 0.947 · 1.5B 0.908
      - title: 1.5B는 조건 검색에서 이름을 빠뜨림
        sub: 재현율 0.77 · 조건 검색 평균 답 길이 2.5명 (정답 평균 3.8명)
      - title: GPU를 바꿔도 정확도는 거의 동일
        desc: 차이는 응답 속도뿐
        sub: 1.5B만 L4 0.908 / T4 0.904 · L4가 T4보다 약 1.2~1.4배 빠름 (1.5B·3B 기준)
      - title: T4에서 7B fp16은 여전히 비효율적
        sub: 평균 6.353초 · 최대 27.434초
    problems:
      - title: 1.5B 조건 검색 재현율이 낮음
        items:
          - 조건 검색 Macro F1 0.718 · 정답 평균 3.8명 중 2.5명만 답함
          - "\"나타 출신 4성\" 질문은 8개 실험 모두 여전히 오답"
          - → rag_v5_data에서 조건 검색은 근거 이름을 그대로 답함
      - title: 3B가 데이터 없음 문항에 답함
        items:
          - "\"미르하젤은 몇 성 캐릭터야?\"에 5성으로 답함"
          - → 근거가 없으면 모델을 부르지 않고 빈 배열로 답함 (rag_v5_data)
      - title: 캐릭터 이름 출력 오류가 계속 발생
        items:
          - "예: 카미サト アヤカ, 노드克赖, JANSA (7B)"
      - title: DEV 평가 문항 수가 적음
        items:
          - 전체 60문항, 조건 검색 16문항
          - → F1 비교 외에 문항별 오류 분석이 중요
    next: rag_v5_data(조건 검색·데이터 없음은 모델 없이 답함) 이후 같은 조건으로 1.5B / 3B / 7B 다시 비교

  rag_v5_data:
    chart_order: [c4a, c4c, c4d, c4e]
    # 조건 검색·데이터 없음은 모델 없이 답해서(약 0.001초) 전체 평균은 모델 속도가 아니다 -> 속도는 캐릭터 조회 평균으로
    speed:
      key: lookup_t
      label: 캐릭터 조회 평균 응답 시간
      axis: 캐릭터 조회 평균 응답 시간
    summary:
      - "조건 검색·데이터 없음은 모델 없이 답해서 세 모델 모두 1.000"
      - "3B가 60문항을 모두 맞혀 Macro F1 1.000, 1.5B·7B는 캐릭터 조회 1문항씩 틀려 0.983"
      - "속도는 모델이 답한 캐릭터 조회 40문항의 평균으로 비교 (L4 · 1.5B 1.077초 · 3B 1.146초 · 7B 1.366초)"
      - "GPU를 바꿔도 성능은 같고 속도만 달라짐 (캐릭터 조회 기준 L4가 T4보다 약 1.3~1.6배 빠름)"
      - "최종 선택한 챗봇 LLM 모델: **Qwen2.5-3B**"
    charts:
      c4a:
        insights:
          - "**모델 크기를 키워도 성능이 좋아지지 않음**"
          - 3B가 Macro F1 1.000으로 1위, 1.5B와 7B는 0.983
          - 조건 검색은 모델 없이 답해서 세 모델 모두 1.000이고, 점수 차이는 캐릭터 조회에서만 나옴
          - "1.5B는 \"아이테르는 어떤 무기를 써?\"에 빈 답, 7B는 시틀라리 지역을 'Appears in the region of 나타'처럼 영어로 답함"
      c4c:
        subtitle: 모델 크기별 캐릭터 조회 평균 응답 시간 (GPU L4 · 정밀도 fp16 기준)
        insights:
          - "**모델이 커질수록 느려짐**"
          - 캐릭터 조회 평균이 1.5B 1.077초 → 3B 1.146초 → 7B 1.366초로 늘어남
          - 조건 검색·데이터 없음은 모델 없이 답해서(약 0.001초) 속도 비교에서 뺌
          - 전체 평균(0.719~0.911초)에는 모델 없이 답한 20문항이 섞여 있어 모델 속도로 보지 않음
      c4d:
        insights:
          - "**같은 모델 안에서는 GPU를 바꿔도 점수가 그대로**"
          - 모든 모델이 L4와 T4에서 같은 점수
          - 7B 4bit는 0.967로 fp16(0.983)보다 캐릭터 조회 1문항을 더 틀림 (라우마 지역을 '노드克赖'로 답함)
      c4e:
        subtitle: 모델 · GPU · 정밀도별 캐릭터 조회 평균 응답 시간
        insights:
          - "**GPU는 점수가 아니라 속도를 바꿈**"
          - 캐릭터 조회 기준 L4가 T4보다 1.5B 약 1.6배, 3B 약 1.3배 빠름
          - T4에서는 3B(1.533초)가 1.5B(1.761초)보다 빨랐음
          - T4에서 7B는 fp16 4.775초, 4bit 3.653초로 L4보다 2.6~3.5배 느림
    findings:
      - title: 조건 검색·데이터 없음은 모든 모델이 만점
        sub: 조건 검색은 근거 이름을 그대로, 근거가 없으면 빈 배열 (모델 없이 답함)
      - title: 3B만 60문항을 모두 맞힘
        sub: 1.5B 아이테르 무기 빈 답 · 7B fp16 시틀라리 영어 문장 · 7B 4bit는 라우마 '노드克赖'까지 2문항 오답
      - title: 모델 속도는 캐릭터 조회 평균으로 비교
        sub: L4 · 1.5B 1.077초 · 3B 1.146초 · 7B 1.366초
      - title: T4에서는 3B가 1.5B보다 빠름
        sub: 캐릭터 조회 평균 3B 1.533초 · 1.5B 1.761초
