# ④ 모델 비교 글 + GPU 메모리 같은 수동 값 (data/model_compare, DEV 60문항 info_v1-dev, rag_v4 프롬프트 고정)
# 글 속 숫자는 직접 쓴다. 재실험하면 summary.py model_compare 출력을 보고 문장·숫자를 고치고 based_on을 갱신 (README 3-3)
based_on:
  folder: model_compare
  created_at: "2026-11-06T05:26:07"

cond: DEV 60문항 · rag_v4 프롬프트 고정

summary:
  - "📏 모델이 크다고 반드시 성능이 좋아지는 것은 아님"
  - "🏆 가장 높은 Macro F1 & 가장 빠른 응답 속도는 1.5B이지만, 조건 검색 재현율은 3B가 더 높음"
  - "🖥️ GPU를 바꿔도 성능은 같고 속도만 달라짐 (L4가 T4보다 약 1.3~1.4배 빠름)"
  - "⚠️ 조건 검색 성능은 모델과 관계없이 0.3~0.5 수준으로 낮음"
  - "✅ 최종 선택한 챗봇 LLM 모델: **Qwen2.5-3B**"

# 크기별 비교 그래프(c4a~c4c)와 숫자 카드의 기준 조합
baseline_setup: {gpu: L4, precision: fp16}

manual:
  gpu_memory:            # 출처: 디스코드 모델 비교 보고서 (11/6, 임준규)
    1.5B: "2.9GB"
    3B: "5.8GB"
    7B: "5.5~14.2GB"

# 모델별 표시 색 (GPU·정밀도 그래프 c4d·c4e). 새 모델은 여기에 추가
models:
  1.5B: {color: "#1D9E75"}
  3B: {color: "#378ADD"}
  7B: {color: "#D85A30"}
highlight_model: 3B      # 결과 표에서 강조할 모델 (최종 선택)

charts:
  c4a:
    title: 모델을 키우면 성능이 좋아지나
    subtitle: 모델 크기별 · 질문 유형별 Macro F1 (GPU L4 · 정밀도 fp16 기준)
    hint: 그래프에 마우스를 올리면 모델별 상세 내용이 보여요.
    insights:
      - "**모델 크기를 키워도 성능이 좋아지지 않아요.**"
      - 1.5B가 Macro F1 0.862로 1위예요.
      - 7B는 3B와 비슷한 수준이에요.
      - 캐릭터 조회는 세 모델 모두 거의 만점이라, 점수 차이는 대부분 조건 검색에서 나와요.
      - "7B에서 'Appears in the region of 나타'처럼 영어가 섞이는 답변이 발생해 캐릭터 조회 성능이 일부 하락했어요."
  c4b:
    title: 1.5B는 왜 점수가 높게 나왔나
    subtitle: 모델별 정밀도와 재현율의 간격 · 조건 검색 평균 답 길이 (GPU L4 · 정밀도 fp16 기준)
    tips:
      precision: 모델이 쓴 답 중 정답 비율 (60문항 전체)
      recall: 정답 중 모델이 찾아낸 비율 (60문항 전체)
      answer_len: 조건 검색 16문항에서 답한 이름 수 평균
    insights:
      - "**조건 검색에서 이름을 적게 출력해(평균 3.1명) 정밀도가 높아진 영향이에요.**"
      - 재현율은 오히려 3B가 더 높아요 (1.5B 0.67 < 3B 0.84).
      - 즉, 1.5B는 답변을 보수적으로 출력하는 경향이 있어요.
      - 1.5B의 높은 점수가 조건 판단 능력이 더 좋다는 의미는 아니에요.
      - 정답이 적은 질문은 1.5B, 정답이 많은 질문은 3B가 유리해요.
  c4c:
    title: 모델을 키우면 속도가 빨라지나
    subtitle: 모델 크기별 · 질문 유형별 평균 응답 시간 (GPU L4 · 정밀도 fp16 기준)
    insights:
      - "**모델이 커질수록 느려져요.**"
      - 평균 응답 시간이 1.5B 1.142초 → 3B 1.843초 → 7B 2.085초로 늘어나요.
      - 캐릭터 조회는 모델 크기와 관계없이 1.036~1.418초로 큰 차이가 없어요.
      - "차이는 조건 검색에서 커요: 1.5B는 1.462초, 3B·7B는 3.819~3.977초예요."
      - 1.5B가 빠른 이유는 모델이 작아서이기도 하지만, 조건 검색에서 이름을 적게 쓰기 때문이기도 해요.
  c4d:
    title: GPU·정밀도는 성능에 얼마나 영향을 주나
    subtitle: 모델 · GPU · 정밀도별 Macro F1
    insights:
      - "**같은 모델 안에서는 GPU·정밀도를 바꿔도 점수가 거의 그대로예요.**"
      - 7B는 4가지 조합 모두 0.794~0.812 사이로, 차이가 0.02 이내예요.
      - DEV 60문항 규모에서 0.01~0.02 차이는 의미 있는 차이로 보기 어려워요.
      - 그래서 정밀도는 T4에서도 쓸 수 있는 fp16으로 통일하는 게 안전해요.
  c4e:
    title: GPU·정밀도는 속도에 얼마나 영향을 주나
    subtitle: 모델 · GPU · 정밀도별 평균 응답 시간
    insights:
      - "**GPU는 점수가 아니라 속도를 바꿔요.**"
      - 같은 모델·정밀도면 L4가 T4보다 약 1.3~1.4배 빨라요.
      - T4에서 7B fp16은 평균 12.648초로 실사용이 어렵고, 7B를 쓴다면 4bit가 현실적이에요.
      - bf16과 fp16의 성능 차이는 크지 않아요 (7B 기준 bf16 0.794 / fp16 0.808).

findings:
  - title: GPU를 바꿔도 정확도는 동일
    desc: 차이는 응답 속도뿐
    sub: L4가 T4보다 약 1.3~1.4배 빠름 (1.5B·3B 기준)
  - title: 모델 크기를 키워도 성능이 좋아지지 않음
    sub: 1.5B 0.862 1위 · 7B는 3B와 비슷 · 7B는 영어가 섞인 답으로 캐릭터 조회 일부 하락
  - title: 1.5B의 높은 점수는 조건 판단 능력 때문이 아님
    sub: 재현율 1.5B 0.67 < 3B 0.84 · 답을 보수적으로 짧게 출력
  - title: bf16과 fp16의 차이는 크지 않음
    sub: 7B 기준 bf16 0.794 / fp16 0.808
  - title: T4에서 7B fp16은 비효율적
    sub: 평균 12.648초 · 메모리 부족으로 일부가 CPU로 넘어갔을 가능성

# 현재 문제점 및 개선 방향 (title + 하위 목록)
problems:
  - title: 🔴 조건 검색 성능이 전반적으로 낮음
    items:
      - 모델과 관계없이 0.3~0.5 수준
      - "\"나타 출신 4성\" 질문은 9개 실험 모두 오답"
      - 모델 크기 문제가 아니라 RAG 검색·조건 처리 문제일 가능성이 큼
      - → rag_v5에서 조건 검색 개선 후 재평가
  - title: 🟠 캐릭터 이름 출력 오류가 계속 발생
    items:
      - "예: 카미サト アヤカ, 노드克赖, JANSA"
      - → 모델 변경만으로 해결되지 않아 이름 정규화·후처리 유지
  - title: 🟡 DEV 평가 문항 수가 적음
    items:
      - 전체 60문항, 조건 검색 16문항
      - 0.01~0.02 정도의 점수 차이는 큰 의미를 두기 어려움
      - → F1 비교 외에 문항별 오류 분석이 중요

# 팀 결정 사항 (title + 하위 목록, 하위 목록이 없으면 desc 한 줄)
decisions:
  - title: "챗봇 기본 모델: Qwen2.5-3B 유지"
    items:
      - 지금까지의 실험 결과가 3B 기준이라 비교·관리가 쉬움
      - 1.5B는 빠르고 DEV 점수가 높지만 추가 검증 필요
      - 7B 4bit는 현재 결과상 뚜렷한 성능 이점 없음
  - title: 추론 서버 GPU
    desc: 같은 모델·정밀도에서 점수가 같으므로 속도·비용·사용 한도로 결정
  - title: 정밀도
    desc: fp16 통일 (bf16의 뚜렷한 이점이 없고 T4는 bf16 미지원)
  - title: 1.5B 공식 평가 진행 여부
    desc: 평가셋은 한 번만 쓰는 규칙이라 진행 시점 논의 필요
  - title: 모델 재비교
    desc: rag_v5 머지 후 1.5B / 3B / 7B 다시 비교

next: rag_v5(조건 검색 개선) 이후 같은 날·같은 GPU로 1.5B / 3B / 7B 다시 비교
