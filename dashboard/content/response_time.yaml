based_on:
  folder: dev
  created_at: "2026-11-10T06:05:17"

cond: DEV 60문항 · Colab T4 · 후처리 없음

summary:
  - "⏱️ rag_v4는 평균 2.384초로 응답하면서 Macro F1 0.796 달성"
  - "📈 baseline 대비 0.489초 느리지만 정확도는 크게 향상"
  - "⚠️ 조건 검색은 평균 4.713초로 상대적으로 느림"

charts:
  c2a:
    title: 점수가 오르는 동안 시간은 얼마나 늘었나
    subtitle: 단계별 Macro F1 · 평균·중앙값 응답 시간
    hint: 그래프에 마우스를 올리면 단계별 상세 내용이 보여요.
    insights:
      - "**품질은 크게 올리고 기다리는 시간은 거의 그대로예요.**"
      - 정확도가 0.011에서 0.796으로 오르는 동안 대기 시간은 0.489초만 늘었어요.
      - 사용자가 체감할 만큼 느려지지 않고 답의 품질만 좋아졌다는 뜻이에요.
  c2b:
    title: 빈 답이 많으면 빨라지나
    subtitle: 단계별 빈 답 수 × 평균 응답 시간
    insights:
      - "**빠른 응답 중 상당수는 \"모른다\"고 답을 비운 결과예요.**"
      - 빈 답이 많은 단계일수록 빨랐어요 (r ≈ −0.904).
      - 속도만 보고 단계를 고르면 오히려 답을 안 하는 챗봇을 고르게 돼요.
      - 속도는 반드시 정확도와 함께 판단해야 해요.
  c2c:
    title: 어디서 느린가
    subtitle: 단계 × 질문 유형별 평균 응답 시간
    insights:
      - "**느린 원인은 조건 검색 하나로 좁혀져요.**"
      - "답을 내는 단계에서는 조건 검색이 캐릭터 조회보다 약 3배 느려요 (rag_v4: 4.713초 vs 1.548초)."
      - 이름을 많이 나열할수록 오래 걸려요.
      - 근거를 줄여 답을 짧게 만드는 rag_v5가 속도 개선에도 가장 효과적이에요.

