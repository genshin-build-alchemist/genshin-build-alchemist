# 응답 시간 글 (data/dev, Info_v2 DEV 60문항, Colab T4 한 런타임에서 일곱 단계를 이어서 측정)
# - 응답 시간의 기준은 DEV 60문항 (response_time-v2.md). 평가 121문항은 단계마다 실행 날짜·코드가 달라서 참고용
# - 숫자 카드 · 그래프 · 단계별 결과 표 · 느린 응답 사례는 JSON에서 자동. 여기에는 사람이 쓰는 문장만 둔다
# - 글 속 숫자는 직접 쓴다. 데이터가 바뀌면 summary.py dev 출력을 보고 고치고 based_on을 갱신 (README 3-3)
based_on:
  folder: dev
  created_at: "2026-11-17T08:29:30"

question: 실험 단계를 거치면서 응답 시간이 어떻게 달라졌나?

charts:
  c2a:
    title: 실험 단계별 Macro F1과 응답 시간
    subtitle: 위 Macro F1 · 아래 평균·중앙값 응답 시간
    hint: 그래프에 마우스를 올리면 세부 정보를 확인할 수 있습니다.
  c2b:
    title: 빈 응답 수와 평균 응답 시간의 관계
    subtitle: 각 점은 실험 단계 한 개를 나타냅니다.
  c2c:
    title: 질문 유형별 평균 응답 시간
    subtitle: 실험 단계별 캐릭터 조회·조건 검색·데이터 없음 비교

# 실험 기록 > 측정 기준 (한 줄에 한 문장, 불릿으로 보인다)
measure:
  - Info_v2 DEV 60문항은 캐릭터 조회 40개, 조건 검색 16개, 데이터 없음 4개로 구성됩니다.
  - 프롬프트 작성과 RAG 근거 검색부터 원문 응답이 나오기까지 측정했습니다.
  - 모델 로딩·응답 정리·채점 시간은 제외했습니다.
  - 일곱 단계를 Colab T4 한 런타임에서 이어서 실행했습니다 (2026-11-17 08:17~08:29 UTC).

by_stage:
  rag_v4:
    answer: Macro F1은 0.521 → 0.796으로 올랐고, 평균 응답 시간은 2.202초 → 2.323초로 늘었습니다.
    insights:
      c2a:
        - "**Macro F1** rag_v3에서 rag_v4로 바뀌면서 Macro F1은 0.521 → 0.796으로 상승했습니다."
        - "**응답 시간** 기록된 평균 응답 시간은 2.202초 → 2.323초, 중앙값은 1.346초 → 1.409초였습니다."
      c2b:
        - "**가장 빠른 단계** 가장 빠른 prompt_v2는 평균 1.078초였고, 60문항 중 52문항에서 빈 응답을 반환했습니다."
        - "**읽는 법** 평균 응답 시간에는 빈 응답도 포함되므로, 속도를 비교할 때는 빈 응답 수와 Macro F1을 함께 확인해야 합니다."
      c2c:
        - "**유형별 시간** rag_v4의 조건 검색은 평균 4.720초, 캐릭터 조회는 1.470초, 데이터 없음은 1.263초였습니다."
        - "**비교** 조건 검색은 캐릭터 조회보다 평균 약 3.2배 오래 걸렸습니다."
    slow_note: 응답 시간이 가장 길었던 세 문항은 모두 조건 검색이었으며, 모두 정답보다 많은 캐릭터를 나열했습니다.
    next: 모든 조건을 충족하는 캐릭터만 근거로 제공한 뒤, 조건 검색의 평균 응답 시간과 Macro F1을 다시 비교합니다.
  rag_v5:
    answer: Macro F1은 0.796 → 0.956으로 올랐고, 평균 응답 시간은 2.323초 → 1.663초로 줄었습니다.
    insights:
      c2a:
        - "**Macro F1** rag_v4에서 rag_v5로 바뀌면서 Macro F1은 0.796 → 0.956으로 상승했습니다."
        - "**응답 시간** 기록된 평균 응답 시간은 2.323초 → 1.663초, 중앙값은 1.409초 → 1.405초였습니다."
      c2b:
        - "**직전 단계 비교** rag_v4 → rag_v5에서 빈 응답은 4개 → 4개(3건은 올바른 거절, 1건은 조건 검색 오답), 평균 응답 시간은 2.323초 → 1.663초였습니다."
        - "**읽는 법** 평균 응답 시간에는 빈 응답도 포함되므로, 속도를 비교할 때는 빈 응답 수와 Macro F1을 함께 확인해야 합니다."
      c2c:
        - "**유형별 시간** rag_v5의 조건 검색은 평균 2.123초, 캐릭터 조회는 1.518초, 데이터 없음은 1.263초였습니다."
        - "**직전 단계 비교** 직전 단계 대비 조건 검색 평균은 4.720초에서 2.123초로 줄었습니다. 근거가 조건을 모두 만족하는 캐릭터로 줄면서 모델이 쓰는 이름 수도 함께 줄었습니다."
    slow_note: 응답 시간이 가장 길었던 세 문항은 여전히 조건 검색이었지만, 답한 캐릭터 수는 정답 수 이하로 줄었습니다. 최대 응답 시간은 6.794초 → 3.385초로 줄었습니다.
    next: 조건 검색은 근거 이름을 그대로 답하고 근거가 없으면 모델을 호출하지 않는 rag_v5_data에서 응답 시간을 다시 비교합니다.
