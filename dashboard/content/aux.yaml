# ③ 보조 지표 글 + 지표 정의 (data/aux, DEV 60문항)
# 글 속 숫자는 직접 쓴다. 데이터가 바뀌면 summary.py aux 출력을 보고 문장·숫자를 고치고 based_on을 갱신 (README 3-3)
based_on:
  folder: aux
  created_at: "2026-11-10T07:17:48"

cond: DEV 60문항 · 후처리 없음 · 저장된 답 재채점

summary:
  - "✅ rag_v4 정답률 0.717로 가장 높음 (60문항 중 43문항 완전 정답)"
  - "📉 RAG로 환각률 0.918 → 0.089 감소"
  - "⚠️ rag_v4 거절 정확도 0.75로 하락 (모르는 캐릭터 1문항에 답함)"

# 지표 정의: 범례 ⓘ 툴팁과 결과 표 아래 설명에 쓴다
definitions:
  accuracy: 정답과 완전 일치(F1 = 1)한 문항 비율
  refusal_accuracy: unknown 4문항 중 [] 반환 비율
  hallucination_rate: 답변에 근거 없는 이름·값이 포함된 비율

charts:
  c3a:
    title: 답의 품질은 어떻게 변했나
    subtitle: 단계별 정답률 · 거절 정확도 · 환각률
    hint: 그래프에 마우스를 올리면 단계별 상세 내용이 보여요.
    insights:
      - "**근거를 넣는 순간 지어내는 답이 거의 사라졌어요.**"
      - 환각률이 prompt_v2 0.875에서 rag 0.088로 급감했어요.
      - 그 뒤로는 환각을 낮게 유지한 채 정답률만 꾸준히 올라갔어요.
      - rag_v4의 거절 정확도 하락은 4문항 중 1건이라 값이 크게 출렁인 거예요.
  c3b:
    title: 많이 답해도 지어내지 않나
    subtitle: 단계별 답한 문항 수 · 그중 환각 건수
    insights:
      - "**prompt_v2의 \"완벽한 거절\"은 답을 거의 안 해서 생긴 착시예요.**"
      - 60문항 중 8문항만 답했고, 그 8개 중 7개가 지어낸 답이었어요.
      - rag_v4는 가장 많은 56문항에 답하면서도 환각은 5건에 그쳤어요.
      - 많이 답하면서도 지어내지 않는, 실제로 쓸 수 있는 챗봇에 가까워졌다는 뜻이에요.
  c3c:
    title: 남은 환각은 어디서 나오나
    subtitle: 단계별 환각률 · 질문 유형별 구성
    insights:
      - "**근거를 넣자 환각 총량이 10분의 1 수준으로 줄었어요.**"
      - prompt_v2까지는 답의 9할 가까이가 지어낸 답이었지만, rag부터는 0.09 이하로 떨어졌어요.
      - "근거를 넣은 뒤 남은 환각은 거의 조건 검색에서 나와요 (rag_v4: 5건 중 4건)."
      - 조건 검색 개선(rag_v5)과 이름 후처리가 환각을 더 줄이는 다음 우선순위예요.

findings:
  - title: rag_v4 정답률 1위
    desc: 60문항 중 43문항 완전 정답
    sub: rag_v3 0.45 → rag_v4 0.717
  - title: RAG 도입으로 환각 대폭 감소
    desc: RAG 방식 모두 환각률 0.09 이하
    sub: baseline 0.918 → rag_v4 0.089 · baseline은 모르는 질문에도 답을 생성
  - title: rag_v4 거절 정확도 하락
    desc: "\"미르하젤은 몇 성 캐릭터야?\"에 5성으로 답함"
    sub: unknown 4문항뿐이라 1건에 0.25씩 변동
  - title: 남은 환각은 대부분 조건 검색
    sub: rag_v4 환각 5건 중 4건 조건 검색 · 1건은 데이터 없음 질문
  - title: 환각률만으로 성능 판단 불가
    desc: Macro F1·빈 답 수와 함께 비교
    sub: rag_v3 0.079 / rag_v4 0.089이지만 답한 문항은 38개 → 56개

