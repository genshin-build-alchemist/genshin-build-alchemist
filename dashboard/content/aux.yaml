# 보조 지표 글 (data/aux의 보조지표_요약 · 보조지표_환각사례 CSV, 평가셋 info_v2 121문항)
# - 숫자 카드 · 그래프 · 단계별 결과 표는 CSV에서 자동. 여기에는 사람이 쓰는 문장만 둔다
# - 글 속 숫자는 직접 쓴다. 데이터가 바뀌면 summary.py aux 출력을 보고 고치고 based_on을 갱신 (README 3-3)
# - created_at은 CSV에 없어서 같은 단계 공식 결과(official)의 값을 쓴다
based_on:
  folder: aux
  created_at: "2026-11-17T06:23:47"

question: 실험 단계를 거치면서 정답률 · 거절 정확도 · 환각률이 어떻게 달라졌나?

# 측정 기준: 범례 ⓘ 툴팁과 실험 기록의 측정 기준 표에 쓴다
definitions:
  accuracy: 정답과 완전히 일치한 문항 ÷ 전체 문항
  refusal_accuracy: 빈 배열로 답한 문항 ÷ 데이터 없음 문항
  hallucination_rate: 근거에 없는 이름이나 값이 포함된 문항 ÷ 답을 낸 문항

# 측정 기준 표에서 기준 아래 작은 회색 글
definition_notes:
  hallucination_rate: ex) 지어낸 이름, 오타, 언어 오류, 근거와 상관 없는 값, 답 형식이 깨진 것

charts:
  c3a:
    title: 실험 단계별 정답률·거절 정확도·환각률
    subtitle: Info_v2 평가 121문항 · 지표별 분모는 실험 기록에서 확인할 수 있습니다.
    hint: 그래프에 마우스를 올리면 세부 정보를 확인할 수 있습니다.
  c3b:
    title: 실험 단계별 응답 문항 수와 환각 문항 수
    subtitle: 막대 전체는 응답 문항 수입니다. 빈 배열로 답한 문항은 제외합니다.
  c3c:
    title: 실험 단계별 환각률과 질문 유형 구성
    subtitle: 유형별 환각 문항 수를 해당 단계의 전체 응답 문항 수로 나눴습니다.

by_stage:
  rag_v4:
    answer: rag_v3에서 rag_v4로 바뀌면서 정답률은 43.8% → 76.0%로 올랐지만, 거절 정확도는 낮아지고 환각률은 조금 높아졌습니다.
    insights:
      c3a:
        - "**정답률** rag_v3에서 rag_v4로 바뀌면서 정답률은 43.8% → 76.0%로 올랐습니다."
        - "**거절·환각** 거절 정확도는 100.0% → 75.0%로 낮아졌고, 환각률은 7.1% → 8.0%로 높아졌습니다."
      c3b:
        - "**응답 수와 환각** prompt_v2는 16문항에 답해 13문항에서 환각이 발생했고, rag_v4는 113문항에 답해 9문항에서 환각이 발생했습니다."
        - "**읽는 법** 환각률은 답을 낸 문항만 기준으로 계산하므로, 몇 문항에 답했는지도 함께 확인해야 합니다."
      c3c:
        - "**유형 구성** rag_v4의 환각 9건 중 7건은 조건 검색, 2건은 데이터 없음 문항에서 발생했습니다."
        - "**캐릭터 조회** 캐릭터 조회에서는 환각이 집계되지 않았습니다."
    findings_lead: 완전 정답 92 / 121문항 · 올바른 거절 6 / 8문항 · 환각 9 / 113 응답 문항
    findings:
      - "**데이터 없음** “나디르는 몇 성?”, “티엔류는 몇 성?”에 모두 4성으로 답했습니다. 두 문항의 정답은 빈 배열이었습니다."
      - "**조건 검색** 폰타인 출신 바위 원소 캐릭터를 묻는 질문에 이나즈마 출신인 고로를 포함했습니다. 고로는 이 질문의 근거에 있었으므로 오답으로 집계했습니다. 환각률은 근거에 없는 이름이나 값을 기준으로 계산합니다."
  rag_v5:
    answer: rag_v4에서 rag_v5로 바뀌면서 정답률은 76.0% → 90.9%로 올랐고, 환각률은 8.0% → 3.5%로 낮아졌습니다.
    insights:
      c3a:
        - "**정답률** rag_v4에서 rag_v5로 바뀌면서 정답률은 76.0% → 90.9%로 올랐습니다."
        - "**거절·환각** 거절 정확도는 75.0%로 같았고, 환각률은 8.0% → 3.5%로 낮아졌습니다."
      c3b:
        - "**응답 수와 환각** rag_v5는 113문항에 답해 4문항에서 환각이 발생했습니다. rag_v4와 응답 문항 수는 같고 환각은 9문항에서 4문항으로 줄었습니다."
        - "**읽는 법** 환각률은 답을 낸 문항만 기준으로 계산하므로, 몇 문항에 답했는지도 함께 확인해야 합니다."
      c3c:
        - "**유형 구성** rag_v5의 환각 4건 중 2건은 조건 검색, 2건은 데이터 없음 문항에서 발생했습니다."
        - "**조건 검색** 조건을 모두 충족하는 캐릭터만 근거로 넣으면서 조건 검색 환각이 7건에서 2건으로 줄었습니다."
    findings_lead: 완전 정답 110 / 121문항 · 올바른 거절 6 / 8문항 · 환각 4 / 113 응답 문항
    findings:
      - "**데이터 없음** “나디르는 몇 성?”, “티엔류는 몇 성?”에 rag_v4와 마찬가지로 4성으로 답했습니다."
      - "**조건 검색** “5성 바위 원소” 질문에 캐릭터 이름을 일본어로 쓰고(リンネア, アルベド 등), “5성 번개 원소” 질문에 라이デン 쇼군으로 써서 환각으로 집계했습니다."
  rag_v5_data:
    answer: 정답률은 90.9% → 99.2%, 거절 정확도는 75.0% → 100.0%로 올랐고, 환각은 한 건도 없었습니다.
    insights:
      c3a:
        - "**정답률** rag_v5에서 rag_v5_data로 바뀌면서 정답률은 90.9% → 99.2%로 올랐습니다."
        - "**거절·환각** 거절 정확도는 75.0% → 100.0%로 올랐고, 환각률은 3.5% → 0.0%가 됐습니다."
      c3b:
        - "**응답 수와 환각** rag_v5_data는 112문항에 답했고, 환각이 발생한 문항은 없었습니다."
        - "**읽는 법** 환각률은 답을 낸 문항만 기준으로 계산하므로, 몇 문항에 답했는지도 함께 확인해야 합니다."
      c3c:
        - "**유형 구성** rag_v5_data에서는 환각이 집계되지 않았습니다. (비어있지 않은 답변 112건 중 근거 밖 항목 0건)"
        - "**모델 호출 없음** 조건 검색은 근거 이름을 그대로 답하고, 근거가 없는 질문은 모델 없이 빈 배열로 답했습니다."
    findings_lead: 완전 정답 120 / 121문항 · 올바른 거절 8 / 8문항 · 환각 0 / 112 응답 문항
    findings:
      - "**캐릭터 조회** 남은 오답 1문항은 별인형·남성의 무기를 묻는 질문입니다. 빈 배열로 답해 환각으로는 집계되지 않았습니다."
