# 성능 변화 글 (data/official, 평가셋 info_v2 121문항)
# - 숫자 카드 · 그래프 · 표 · 오답 문항 예시는 JSON에서 자동. 여기에는 사람이 쓰는 문장만 둔다
# - by_stage: 실험 단계 버튼으로 고른 단계의 글. 새 단계가 생기면 블록을 하나 추가
# - 글 속 숫자는 직접 쓴다. 데이터가 바뀌면 summary.py official 출력을 보고 고치고 based_on을 갱신 (README 3-3)
based_on:
  folder: official
  created_at: "2026-11-17T06:23:47"

header:
  data_version: 데이터 7.2   # 데이터 배지 "Info_v2 · 평가 121문항 · 데이터 7.2"의 뒷부분

question: 실험 단계를 거치면서 Macro F1이 얼마나 올랐나?

charts:
  c1a:
    title: 실험 단계별 Macro F1의 변화
    subtitle: 전체 및 질문 유형별 비교
    hint: 그래프에 마우스를 올리면 세부 정보를 확인할 수 있습니다.

# 실험 기록 > 측정 기준 (모든 단계 공통, 맨 위). sub = 아래 작은 회색 줄
measure:
  - desc: 정밀도 = 정답과 일치한 항목 수 ÷ 모델이 답한 항목 수
  - desc: 재현율 = 정답과 일치한 항목 수 ÷ 정답 항목 수
  - desc: 문항별 F1 = 2 × 정밀도 × 재현율 ÷ (정밀도 + 재현율)
  - desc: 유형별 Macro F1 = 해당 유형의 문항별 F1 합계 ÷ 해당 유형의 문항 수
    sub: (캐릭터 조회는 87문항, 조건 검색은 26문항, 데이터 없음은 8문항)
  - desc: 전체 Macro F1 = 121문항의 문항별 F1 합계 ÷ 121

by_stage:
  rag_v4:
    answer: 성급·지역 예시와 규칙을 추가한 rag_v4에서 전체 Macro F1이 0.501 → 0.817로 올랐습니다.
    insights:
      c1a:
        - "**전체 흐름** 전체 Macro F1은 두 단계에서 크게 올랐습니다. 검색 근거를 처음 넣은 rag에서 0.066 → 0.391로, 성급·지역 예시와 규칙을 추가한 rag_v4에서 0.501 → 0.817로 상승했습니다."
        - "**캐릭터 조회** 성급과 지역 정보를 어떻게 읽어야 하는지 프롬프트에 명시한 뒤, 0.517 → 0.989로 올랐습니다. 87문항 중 86문항의 답이 정답과 일치했습니다."
        - "**조건 검색** rag_v3에서 0.293까지 올랐지만 rag_v4에서는 0.262로 내려갔습니다. 여러 조건을 함께 물으면 조건을 일부만 충족한 캐릭터도 답에 포함됐습니다."
        - "**데이터 없음** rag_v3에서는 8문항 모두 빈 배열로 올바르게 답했습니다. rag_v4에서는 데이터에 없는 두 캐릭터의 성급을 4성으로 답해 1.000 → 0.750으로 내려갔습니다."
    findings_note: 조건 검색에서는 문항당 정답이 평균 4.0명이었고, 챗봇은 평균 14.7명을 답했습니다. 데이터에 없는 캐릭터 2명의 성급을 4성으로 답했습니다.
    problems:   # [질문 유형, 문제점, 다음 과제]
      - ["조건 검색", "일부 조건만 충족한 캐릭터도 검색 근거에 포함됐고, 답변에도 함께 나열됐습니다.", "다음 단계인 rag_v5에서는 모든 조건을 충족하는 캐릭터만 검색 근거로 제공합니다."]
      - ["데이터 없음", "나디르와 티엔류의 성급을 모두 4성으로 답했습니다.", "근거가 없는 캐릭터에 빈 배열을 반환하는지 확인합니다."]
  rag_v5:
    answer: rag_v5에서 전체 Macro F1은 0.817 → 0.952로 올랐고, 전체 점수 상승은 조건 검색에서 나왔습니다.
    insights:
      c1a:
        - "**전체 흐름** rag_v5에서 전체 Macro F1은 0.817 → 0.952로 올랐습니다. 캐릭터 조회와 데이터 없음 점수는 그대로였고, 전체 점수 상승은 조건 검색에서 나왔습니다."
        - "**캐릭터 조회** 0.989를 유지했습니다. 별인형·남성의 무기를 묻는 문항에는 이전 단계와 마찬가지로 빈 배열을 반환했습니다."
        - "**조건 검색** 모든 조건을 충족하는 캐릭터만 근거로 넣자 0.262 → 0.890으로 올랐습니다. 답을 생성하는 모델에 전달하는 근거부터 좁힌 결과입니다."
        - "**데이터 없음** 0.750에 머물렀습니다. 나디르와 티엔류의 성급을 묻는 두 문항에서 여전히 4성이라고 답했습니다."
    findings_note: 조건 검색의 정답·오답 문항 수는 완전 일치 기준으로 집계했습니다.
    problems:
      - ["조건 검색", "조건에 맞는 일부 캐릭터를 답에서 빠뜨렸습니다.", "rag_v5_data에서는 조건을 모두 충족한 캐릭터 이름을 검색 결과에서 그대로 반환합니다."]
      - ["데이터 없음", "나디르와 티엔류의 성급을 여전히 4성으로 답했습니다.", "근거가 없으면 모델을 호출하지 않고 빈 배열을 반환합니다."]
  rag_v5_data:
    answer: 전체 Macro F1은 0.952 → 0.992로 올랐고, 조건 검색과 데이터 없음은 모두 1.000을 기록했습니다.
    insights:
      c1a:
        - "**전체 흐름** 전체 Macro F1은 0.952 → 0.992로 올랐습니다. 조건 검색과 데이터 없음 문항에 모델을 호출하지 않고 답하면서 두 유형 모두 1.000을 기록했습니다."
        - "**캐릭터 조회** 이 유형은 계속 모델이 답했고, 점수는 0.989를 유지했습니다. 남은 오답은 별인형·남성의 무기를 묻는 문항 한 개였습니다."
        - "**조건 검색** 조건에 맞는 캐릭터 이름을 검색 결과에서 그대로 반환하면서 0.890 → 1.000으로 올랐습니다. 평가에 포함된 조건 검색 26문항의 답이 모두 정답과 일치했습니다."
        - "**데이터 없음** 근거가 없으면 바로 빈 배열을 반환하도록 바꿨습니다. 이전 단계에서 틀렸던 두 문항이 해결되면서 0.750 → 1.000으로 올랐습니다."
    findings_note: 남은 오답은 캐릭터 조회 1문항이었습니다. 별인형·남성의 무기를 묻는 질문에 빈 배열로 답했습니다.
    problems:
      - ["캐릭터 조회", "검색 근거에 ‘한손검’이 있었지만 모델이 빈 배열을 반환했습니다.", "해당 근거가 실제 프롬프트에 어떻게 전달됐는지 확인합니다."]
